apis:
- name: Madvertise Ad Request API
  description: >-
    JSON ad-request endpoint (mobile.mng-ads.com) that returns a single ad
    (banner, interstitial, native) for a given placement, device User-Agent, SDK
    version and consent signal. GET or POST.
  humanURL: https://developers.bluestack.app/adserving/ad-request-api-documentation
  baseURL: https://mobile.mng-ads.com
  tags:
  - Advertising
  - Mobile
  - Monetization
  properties:
  - type: Documentation
    url: https://developers.bluestack.app/adserving/ad-request-api-documentation
- name: Madvertise OpenRTB Bid Request API
  description: >-
    OpenRTB 2.5 bid-request endpoint (mobile.mng-ads.com/bidrequest/{placement})
    for programmatic in-app demand. POST JSON with x-openrtb-version 2.5; returns
    bid markup in the adm field, 204 when no bid, 400 with x-bluestack-message on
    invalid requests.
  humanURL: https://developers.bluestack.app/adserving/open-rtb-bid-request-api
  baseURL: https://mobile.mng-ads.com
  tags:
  - Advertising
  - Programmatic
  - OpenRTB
  properties:
  - type: Documentation
    url: https://developers.bluestack.app/adserving/open-rtb-bid-request-api
- name: Madvertise Reporting API
  description: >-
    Token-authenticated JSON reporting API family covering seller (publisher), buyer
    (advertiser), DSP and mediation reporting. POST /auth-reporting mints an opaque
    token passed bare in the Authorization header, then reports are submitted
    (/seller-reporting, /buyer-reporting, /mediation-reporting) with unix `since`/`until`
    bounds and a breakdowns[] array, polled via /status-reporting and retrieved via
    /download-reporting. Returns a JSON data[] plus a summary object with metrics such as
    requests, displays, clicks, downloads, leads and revenueEuro/revenueDollar. The
    reference is public but the base host is withheld — "accessed via the https://xxx.com
    domain (ask to your Azerion contact)" — so no baseURL is recorded.
  humanURL: https://developers.bluestack.app/reporting/
  tags:
  - Advertising
  - Reporting
  - Analytics
  - Monetization
  x-base-url-status: undisclosed-by-provider
  properties:
  - type: Documentation
    url: https://developers.bluestack.app/reporting/
