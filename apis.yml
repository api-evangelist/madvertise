aid: madvertise
name: Madvertise
description: >-
  Madvertise is a mobile advertising and monetization brand now operating within
  Azerion as the "BlueStack" (Improve Digital InApp) mobile SDK suite and the
  mng-ads.com ad-serving platform. It lets mobile publishers monetize in-app
  inventory with banner, interstitial, native, rewarded-video and App Open ad
  formats through first-party SDKs for Android, iOS, Unity, React Native, Flutter
  and .NET MAUI, and connects programmatic demand through an OpenRTB 2.5
  bid-request API, a JSON ad-request API, VAST video, and a Prebid Server adapter.
  A separate token-authenticated reporting API family serves sellers, buyers, DSPs and
  mediation partners with revenue and delivery data. The platform advertises IAB TCF,
  IAB Open Measurement, GDPR and COPPA compliance. Originally a Munich-founded mobile ad
  network backed by Point Nine Capital, Madvertise's technology now ships under
  Azerion / Improve Digital, whose GitHub org also publishes a first-party MCP server
  for publisher inventory management.
