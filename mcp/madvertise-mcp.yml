scope:
  covers_this_providers_apis: false
  target_api: Improve Digital / 360Yield publisher inventory management API
  target_host: https://api.360yield.com
  statement: >-
    OWNERSHIP + SCOPE, STATED PLAINLY: this MCP server wraps the Improve Digital
    360Yield PUBLISHER INVENTORY API (api.360yield.com), which is Azerion's sell-side
    inventory-management surface. It does NOT wrap the Madvertise ad-serving APIs on
    mobile.mng-ads.com (ad request, OpenRTB bid request) and it does NOT wrap the
    BlueStack mobile SDKs. It is recorded here because Azerion/Improve Digital is the
    entity this repo profiles and no separate improve-digital or azerion repo exists in
    the catalog — but an agent must not assume these tools reach Madvertise inventory.
  spec_not_adopted: >-
    The repo commits a real OpenAPI 3.0.1 document at
    src/swagger/registry/improveDigitalInventorySwagger.json (4 paths, 6 operations).
    It is deliberately NOT saved into this repo's openapi/ and NO type: OpenAPI pointer
    is emitted, because info.title is "360Yield Inventory" — a sibling Azerion product,
    not Madvertise. Adopting it would credit Madvertise with an API it does not ship.
server:
  name: improvedigital_mcp_server
  transport: [http, stdio]
  url: null
  hosted: false
  deployment: self-hosted
