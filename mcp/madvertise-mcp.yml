tools:
- name: inventories_get_inventories
  description: List inventories for a publisher.
  rest: GET /publisher/v1/publishers/{publisherId}/inventories
  source_operation: getInventories
- name: inventories_get_inventory_zones
  description: List the zones inside an inventory.
  rest: GET /publisher/v1/publishers/{publisherId}/inventories/{inventoryId}/zones
  source_operation: getInventoryZones
- name: inventories_get_inventory_placements
  description: List the placements inside a zone.
  rest: GET /publisher/v1/publishers/{publisherId}/inventories/{inventoryId}/zones/{zoneId}/placements
  source_operation: getInventoryPlacements
- name: inventories_get_inventory_placement
  description: Retrieve a single placement.
  rest: GET /publisher/v1/publishers/{publisherId}/inventories/{inventoryId}/zones/{zoneId}/placements/{placementId}
  source_operation: getInventoryPlacement
- name: inventories_create_inventory_placement
  description: Create a placement in a zone.
  rest: POST /publisher/v1/publishers/{publisherId}/inventories/{inventoryId}/zones/{zoneId}/placements
  source_operation: createInventoryPlacement
- name: inventories_update_inventory_placement
  description: Update an existing placement.
  rest: PUT /publisher/v1/publishers/{publisherId}/inventories/{inventoryId}/zones/{zoneId}/placements/{placementId}
  source_operation: updateInventoryPlacement
