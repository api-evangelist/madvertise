note: >-
  Madvertise's mobile SDK lineage is published under the Azerion "BlueStack" (Improve
  Digital InApp) brand. These are first-party mobile monetization CLIENT SDKs, not
  server-side API clients — there is no server SDK for the ad-request, OpenRTB or
  reporting APIs in any language. Package names and install lines are quoted from the
  developer docs; every `version` + `published` pair below was read from the registry's
  own metadata endpoint on 2026-08-12, not from the docs.
  CURRENCY FINDINGS: the Android core ships from a private packagecloud Maven repo whose
  maven-metadata.xml is not publicly readable (404), so no publish date can be
  established for the flagship artifact. The .NET MAUI package has not shipped since
  2024-07-04 — over two years behind the v6 native line. And the Unity docs instruct
  users to pin "com.azerion.bluestack": "6.0.0", a version that DOES NOT EXIST on the
  registry: npm carries 3.4.1 as `latest` and only 6.0.0-beta.5 on the `beta` tag.
