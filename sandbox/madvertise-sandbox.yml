gaps:
- No sandbox/test values are published for the OpenRTB bid-request API — the test
  placement IDs are documented for the mobile SDK path only.
- No test tokens or fixture accounts are published for the reporting APIs; those
  require credentials issued by an Azerion contact.
- No time simulation / test clocks.
